<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superstore Executive Overview</title>
<!--
  hayaData 2026 talk — Executive Overview dashboard, built entirely from the real
  Superstore sample (sample_-_superstore.xls, US rows only — see generate_dashboard_data.py
  for exactly which columns feed which chart). No fixed year split any more: a global
  date-range + dimension filter bar (top-left) narrows every card at once, styled and
  behaved after the internal reports-playground filter-bar/date-picker pattern (vendored
  here as plain, self-contained JS/CSS — no external dependency — so the talk demo never
  depends on a live network or another repo being checked out on the machine it runs on).

  The sample data runs through 2026-12-30, but rows after the real today (read from the
  browser's own clock at load time) are dropped entirely, not just hidden behind a
  disabled calendar day — a live dashboard can't show business that hasn't happened yet.
  Default view on load: last 7 days, Day granularity on the overtime chart.

  "Manufacturer" isn't a real column in this dataset; it's approximated as the first
  word of Product Name, the same heuristic the public Tableau Superstore tutorials use.

  The State map renders real US state geography via chartjs-chart-geo (a Chart.js
  choropleth controller, loaded from cdn.jsdelivr.net) fed by us-atlas topojson
  boundaries bundled locally as us-states-10m.json (fetched same-origin, not from
  a CDN, so it works offline and inside a sandboxed Artifact preview).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-geo@4.3.6/build/index.umd.min.js"></script>
<link rel="stylesheet" href="dashboard-theme.css">
<style>
  /* ── page-local additions on top of the shared theme (theme file itself is untouched) ── */
  .metric-toggle { display: flex; gap: 8px; flex-shrink: 0; }
  .metric-toggle button {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 18px; color: var(--text-secondary); font-family: var(--font);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .metric-toggle button:hover { border-color: var(--accent); color: var(--text-primary); }
  .metric-toggle button.active { background: var(--accent); color: var(--canvas); border-color: var(--accent); }

  .kpi-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .metric-card { min-width: 0; }

  .gran-toggle { display: flex; gap: 2px; flex-shrink: 0; }
  .gran-toggle button {
    background: var(--nested); border: 1px solid var(--border); color: var(--text-secondary);
    font-family: var(--font); font-size: 11px; font-weight: 600; padding: 5px 9px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .gran-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .gran-toggle button:last-child { border-radius: 0 6px 6px 0; }
  .gran-toggle button + button { border-left: none; }
  .gran-toggle button:hover { color: var(--text-primary); }
  .gran-toggle button.active { background: var(--accent); color: var(--canvas); border-color: var(--accent); }

  .report-body .card { min-width: 0; }
  .card-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-box, .chart-box canvas { max-width: 100%; }

  /* ═══════════════════════════════════════════════════════════════
     FILTER BAR — global dropdowns + date picker, vendored to match the
     reports-playground dashboard pattern (dd-wrap/dd-btn/dd-panel, dp-*).
     Plain CSS, no proprietary values — same design tokens as dashboard-theme.css.
  ═══════════════════════════════════════════════════════════════ */
  .dd-wrap { position: relative; }
  .dd-btn.filter-dd {
    display: flex; align-items: center; gap: 8px; cursor: pointer; transition: border-color .15s;
  }
  .dd-btn.open      { border-color: var(--text-primary); color: var(--text-primary); }
  .dd-label { flex: 1; text-align: left; }
  .dd-clear { display: none; align-items: center; justify-content: center; width: 14px; height: 14px; flex-shrink: 0; color: var(--text-disabled); }
  .dd-clear:hover { color: var(--text-primary); }
  .dd-clear svg { width: 10px; height: 10px; }
  .dd-btn.has-value .dd-clear { display: flex; }
  .dd-btn.filter-dd .dd-chevron { transition: transform .15s; }
  .dd-btn.open .dd-chevron { transform: rotate(180deg); }

  .dd-panel {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 220px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; z-index: 100; display: none; flex-direction: column;
  }
  .dd-panel.open { display: flex; }
  .dd-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; white-space: nowrap; }
  .dd-item:hover { background: var(--border-subtle); color: var(--text-primary); }
  .ms-cb { width: 16px; height: 16px; border-radius: 2px; border: 1px solid var(--text-primary); background: transparent; flex-shrink: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dd-item.selected .ms-cb { background: var(--text-primary); border-color: var(--text-primary); }
  .ms-cb svg { display: none; width: 10px; height: 10px; color: var(--card); }
  .dd-item.selected .ms-cb svg { display: block; }
  .dd-divider { height: 1px; background: var(--border); margin: 2px 8px; }
  .dd-items-scroll { max-height: 320px; overflow-y: auto; }
  .dd-search-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; height: 32px; padding: 0 8px; margin-bottom: 4px; position: sticky; top: 0; z-index: 1; }
  .dd-search-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .dd-search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 14px; font-family: var(--font); }
  .dd-search-input::placeholder { color: var(--text-secondary); }

  .filter-apply-btn { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--canvas); cursor: pointer; white-space: nowrap; }
  .filter-apply-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .filter-apply-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
  .filter-clear-btn { height: 32px; padding: 0 8px; background: transparent; border: none; font-family: var(--font); font-size: 14px; font-weight: 400; color: var(--accent); cursor: pointer; white-space: nowrap; }
  .filter-clear-btn:hover { text-decoration: underline; }

  #dp-wrap { position: relative; }
  #dp-trigger { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-family: var(--font); min-width: 200px; height: 36px; transition: border-color .15s; }
  #dp-trigger:hover { border-color: var(--text-disabled); color: var(--text-primary); }
  #dp-trigger.open  { border-color: var(--accent); color: var(--text-primary); }
  #dp-trigger svg { width: 16px; height: 16px; flex-shrink: 0; }
  #dp-panel { position: absolute; top: calc(100% + 4px); left: 0; background: var(--overlay); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 200; display: none; gap: 16px; }
  #dp-panel.open { display: flex; }
  .dp-shortcuts { display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
  .dp-shortcut { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .dp-shortcut:hover { background: var(--border-subtle); color: var(--text-primary); }
  .dp-shortcut.active { color: var(--accent); background: var(--accent-muted); }
  .dp-cal { display: flex; flex-direction: column; gap: 8px; }
  .dp-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .dp-nav-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 4px; border-radius: 4px; display: flex; }
  .dp-nav-btn:hover { background: var(--border-subtle); color: var(--text-primary); }
  .dp-nav-btn svg { width: 16px; height: 16px; display: block; }
  .dp-month-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }
  .dp-weekday { font-size: 11px; color: var(--text-disabled); text-align: center; padding: 4px 0; font-weight: 600; }
  .dp-cell { display: flex; align-items: center; justify-content: center; }
  .dp-cell.in-range { background: var(--accent-range, rgba(229,255,0,0.15)); }
  .dp-cell.range-start { background: linear-gradient(to right, transparent 50%, var(--accent-range, rgba(229,255,0,0.15)) 50%); }
  .dp-cell.range-end { background: linear-gradient(to left, transparent 50%, var(--accent-range, rgba(229,255,0,0.15)) 50%); }
  .dp-day { width: 30px; height: 30px; border-radius: 50%; margin: 1px auto; background: transparent; border: none; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-secondary); cursor: pointer; font-family: var(--font); }
  .dp-day:hover { background: var(--border-subtle); color: var(--text-primary); }
  .dp-day.other-month { color: var(--text-disabled); }
  .dp-day.disabled, .dp-day.other-month.disabled { color: #3a3a3a; cursor: default; pointer-events: none; }
  .dp-day.disabled:hover { background: transparent; color: #3a3a3a; }
  .dp-day.selected, .dp-day.range-dot { background: var(--accent); color: var(--canvas); font-weight: 600; }
  .dp-apply-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .dp-apply-btn { height: 32px; padding: 0 16px; background: var(--accent); border: none; border-radius: 8px; font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--canvas); cursor: pointer; }
  .dp-apply-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .dp-apply-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
</style>
</head>
<body>

<div class="filter-bar" id="filter-bar">
  <div class="metric-toggle" id="metric-toggle">
    <button data-metric="sales" class="active">Sales</button>
    <button data-metric="profit">Profit</button>
    <button data-metric="orders">Orders</button>
  </div>
</div>

<main class="report-body">

  <div class="kpi-row cols-4">
    <div class="metric-card">
      <div class="metric-label">Sales</div>
      <div class="metric-value" id="kpi-sales-value">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Profit</div>
      <div class="metric-value" id="kpi-profit-value">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"># Orders</div>
      <div class="metric-value" id="kpi-orders-value">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"># Customers</div>
      <div class="metric-value" id="kpi-customers-value">—</div>
    </div>
  </div>

  <div class="card span-6">
    <div class="card-header">
      <span class="card-title" id="title-overtime">Sales Over Time</span>
      <div class="gran-toggle" id="gran-toggle">
        <button data-gran="day" class="active">Day</button>
        <button data-gran="week">Week</button>
        <button data-gran="month">Month</button>
        <button data-gran="quarter">Quarter</button>
        <button data-gran="year">Year</button>
      </div>
    </div>
    <div class="chart-box"><canvas id="chart-overtime"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-map">Sales | By State</span></div>
    <div class="chart-box"><canvas id="chart-map"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-segment">Sales | By Segment</span></div>
    <div class="chart-box"><canvas id="chart-segment"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-mfg">Sales | By Top 10 Manufacturers</span></div>
    <div class="chart-box"><canvas id="chart-mfg"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-subcat">Sales | By Sub-Category (Top 10)</span></div>
    <div class="chart-box"><canvas id="chart-subcat"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-customers">Sales | By Top 10 Customers</span></div>
    <div class="chart-box"><canvas id="chart-customers"></canvas></div>
  </div>

  <div class="card span-3">
    <div class="card-header"><span class="card-title" id="title-category">Sales | By Category</span></div>
    <div class="chart-box"><canvas id="chart-category"></canvas></div>
  </div>

</main>

<script src="dashboard_data.js"></script>
<script>
Chart.register(ChartDataLabels);

/* ── static reference data (not derived from the .xls) ─────────────────────── */
const STATE_NAME = {
  AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',
  CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',
  HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',
  LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',
  MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',
  NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',
  OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',
  SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',
  WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',
};
const NAME_TO_ABBR = Object.fromEntries(Object.entries(STATE_NAME).map(([abbr, name]) => [name, abbr]));

/* ── real US state geometry (topojson, fetched once from cdn.jsdelivr.net) ── */
let US_STATES_FEATURES = null, US_NATION_FEATURE = null;
fetch('us-states-10m.json')
  .then(r => r.json())
  .then(us => {
    US_NATION_FEATURE = ChartGeo.topojson.feature(us, us.objects.nation).features[0];
    US_STATES_FEATURES = ChartGeo.topojson.feature(us, us.objects.states).features;
    renderMap(filteredRows());
  })
  .catch(() => { /* offline or CDN blocked — map card stays empty, every other chart is unaffected */ });

/* ── tiny DOM/util helpers ───────────────────────────────────────────────── */
function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const CHEVRON = '<svg class="dd-chevron" viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLEAR_X = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>';
const MS_CB = '<span class="ms-cb"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,7.5 8.5,2"/></svg></span>';
const SEARCH_SVG = '<svg class="dd-search-icon" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4" stroke="#bababa" stroke-width="1.5"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="#bababa" stroke-width="1.5" stroke-linecap="round"/></svg>';

const _openables = []; // { panelEl, btnEl }
function closeAllDropdowns() {
  _openables.forEach(({ panelEl, btnEl }) => { panelEl.classList.remove('open'); btnEl.classList.remove('open'); });
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.dd-wrap') && !e.target.closest('#dp-wrap')) closeAllDropdowns();
});

/* ── vendored multi-select dropdown (mirrors the reports-playground filter-bar look) ── */
function createMultiSelect({ mountId, label, items }) {
  const mount = document.getElementById(mountId);
  const wrap = document.createElement('div'); wrap.className = 'dd-wrap';
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn filter-dd';
  btn.innerHTML = `<span class="dd-label">${label}</span><span class="dd-clear" title="Clear">${CLEAR_X}</span>${CHEVRON}`;
  const panel = document.createElement('div'); panel.className = 'dd-panel';
  wrap.appendChild(btn); wrap.appendChild(panel);
  mount.appendChild(wrap);

  // items: string[] or {value,label}[] — value is what's stored/filtered on, label is what's shown/searched
  const norm = items.map(it => (it && typeof it === 'object') ? it : { value: it, label: it });
  const labelOf = (v) => { const m = norm.find(n => n.value === v); return m ? m.label : v; };

  let selected = [];
  const hasSearch = norm.length > 10;

  function updateLabel() {
    const lbl = btn.querySelector('.dd-label');
    if (!selected.length) { lbl.textContent = label; btn.classList.remove('has-value'); }
    else if (selected.length === 1) { lbl.textContent = labelOf(selected[0]); btn.classList.add('has-value'); }
    else { lbl.textContent = selected.length + ' selected'; btn.classList.add('has-value'); }
  }

  function renderPanel(filterText) {
    panel.innerHTML = '';
    let input = null;
    if (hasSearch) {
      const searchRow = document.createElement('div'); searchRow.className = 'dd-search-row';
      searchRow.innerHTML = SEARCH_SVG + '<input class="dd-search-input" type="text" placeholder="Search">';
      panel.appendChild(searchRow);
      input = searchRow.querySelector('input');
      input.value = filterText || '';
      input.addEventListener('input', () => { renderPanel(input.value); });
    }
    const scroll = document.createElement('div'); scroll.className = 'dd-items-scroll';
    const allDiv = document.createElement('div'); allDiv.className = 'dd-item' + (selected.length === 0 ? ' selected' : '');
    allDiv.innerHTML = MS_CB + 'All';
    allDiv.addEventListener('click', () => { selected = []; renderPanel(input ? input.value : ''); updateLabel(); onAnyFilterChange(); });
    scroll.appendChild(allDiv);
    const divider = document.createElement('div'); divider.className = 'dd-divider'; scroll.appendChild(divider);
    const q = (filterText || '').toLowerCase();
    norm.filter(it => !q || it.label.toLowerCase().includes(q)).forEach(it => {
      const d = document.createElement('div'); d.className = 'dd-item' + (selected.includes(it.value) ? ' selected' : '');
      d.innerHTML = MS_CB + escHtml(it.label);
      d.addEventListener('click', () => {
        const idx = selected.indexOf(it.value);
        if (idx === -1) selected.push(it.value); else selected.splice(idx, 1);
        d.classList.toggle('selected');
        allDiv.classList.toggle('selected', selected.length === 0);
        updateLabel();
        onAnyFilterChange();
      });
      scroll.appendChild(d);
    });
    panel.appendChild(scroll);
    if (input) input.focus();
  }

  btn.addEventListener('click', (e) => {
    if (e.target.closest('.dd-clear')) {
      e.stopPropagation();
      selected = []; renderPanel(); updateLabel(); onAnyFilterChange();
      return;
    }
    const isOpen = panel.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) { panel.classList.add('open'); btn.classList.add('open'); renderPanel(); }
  });

  _openables.push({ panelEl: panel, btnEl: btn });
  return {
    getSelected: () => selected.slice(),
    clear: () => { selected = []; renderPanel(); updateLabel(); },
  };
}

/* ── vendored date picker — shortcuts anchored to the caller's maxDate (the effective "today") ── */
function createDatePicker({ mountId, minDate, maxDate, onApply }) {
  const mount = document.getElementById(mountId);
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = maxDate; // anchor "future" off the real "today" the caller passed in

  const _from7 = new Date(maxDate + 'T00:00:00'); _from7.setDate(_from7.getDate() - 6);
  let dpFrom = fmt(_from7), dpTo = maxDate, dpPhase = 'from', dpHover = null; // default: last 7 days
  let anchor = new Date(maxDate + 'T00:00:00');
  let dpViewY = anchor.getFullYear(), dpViewM = anchor.getMonth();

  const wrap = document.createElement('div'); wrap.id = 'dp-wrap';
  wrap.innerHTML =
    '<button id="dp-trigger"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg><span id="dp-label">–</span></button>' +
    '<div id="dp-panel"><div class="dp-shortcuts">' +
      '<div class="dp-shortcut" data-days="0">Today</div>' +
      '<div class="dp-shortcut" data-days="1">Yesterday</div>' +
      '<div class="dp-shortcut active" data-days="7">Last 7 days</div>' +
      '<div class="dp-shortcut" data-days="30">Last 30 days</div>' +
      '<div class="dp-shortcut" data-days="month">This month</div>' +
      '<div class="dp-shortcut" data-days="year">This year</div>' +
      '<div class="dp-shortcut" data-days="custom">All data</div>' +
    '</div><div class="dp-cal">' +
      '<div class="dp-nav"><button class="dp-nav-btn" id="dp-prev-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.09l-4.58-4.59 4.58-4.59L14 5.5l-6 6 6 6z"/></svg></button>' +
      '<span class="dp-month-label" id="dp-month-label"></span>' +
      '<button class="dp-nav-btn" id="dp-next-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.34l4.58-4.59-4.58-4.59L10 5.75l6 6-6 6z"/></svg></button></div>' +
      '<div class="dp-grid" id="dp-weekdays"></div><div class="dp-grid" id="dp-grid"></div>' +
      '<div class="dp-apply-row"><button class="dp-apply-btn" id="dp-apply-btn" disabled>Apply</button></div>' +
    '</div></div>';
  mount.appendChild(wrap);

  const trigger = wrap.querySelector('#dp-trigger');
  const panel = wrap.querySelector('#dp-panel');
  const wdGrid = wrap.querySelector('#dp-weekdays');
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
    const cell = document.createElement('div'); cell.className = 'dp-weekday'; cell.textContent = d; wdGrid.appendChild(cell);
  });

  function buildCal() {
    const grid = wrap.querySelector('#dp-grid');
    const lbl = wrap.querySelector('#dp-month-label');
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    lbl.textContent = months[dpViewM] + ' ' + dpViewY;
    grid.innerHTML = '';
    const lo = dpPhase === 'to' && dpHover && dpHover < dpFrom ? dpHover : dpFrom;
    const hi = dpPhase === 'to' && dpHover ? (dpHover > dpFrom ? dpHover : dpFrom) : dpTo;
    const firstDay = new Date(dpViewY, dpViewM, 1);
    const startSlot = firstDay.getDay();
    const daysInMonth = new Date(dpViewY, dpViewM + 1, 0).getDate();
    const prevMonthDays = new Date(dpViewY, dpViewM, 0).getDate();
    for (let i = startSlot - 1; i >= 0; i--) {
      const cell = document.createElement('div'); cell.className = 'dp-cell';
      const b = document.createElement('button'); b.className = 'dp-day other-month'; b.textContent = prevMonthDays - i; b.disabled = true;
      cell.appendChild(b); grid.appendChild(cell);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${dpViewY}-${pad(dpViewM + 1)}-${pad(d)}`;
      const cell = document.createElement('div'); cell.className = 'dp-cell';
      const b = document.createElement('button'); b.className = 'dp-day'; b.textContent = d; b.dataset.date = dateStr;
      if (dateStr > todayStr || dateStr < minDate) { b.classList.add('disabled'); b.disabled = true; }
      else {
        if (dateStr === lo && dateStr === hi) b.classList.add('selected');
        else if (dateStr === lo) { cell.classList.add('range-start'); b.classList.add('range-dot'); }
        else if (dateStr === hi) { cell.classList.add('range-end'); b.classList.add('range-dot'); }
        else if (dateStr > lo && dateStr < hi) cell.classList.add('in-range');
      }
      cell.appendChild(b); grid.appendChild(cell);
    }
    const totalSlots = startSlot + daysInMonth;
    const remaining = totalSlots % 7 === 0 ? 0 : 7 - (totalSlots % 7);
    const nY = dpViewM === 11 ? dpViewY + 1 : dpViewY, nM = dpViewM === 11 ? 0 : dpViewM + 1;
    for (let d = 1; d <= remaining; d++) {
      const dateStr = `${nY}-${pad(nM + 1)}-${pad(d)}`;
      const cell = document.createElement('div'); cell.className = 'dp-cell';
      const b = document.createElement('button'); b.className = 'dp-day other-month';
      if (dateStr > todayStr || dateStr < minDate) b.classList.add('disabled');
      b.textContent = d; b.disabled = true;
      cell.appendChild(b); grid.appendChild(cell);
    }
  }
  function renderLabel() { wrap.querySelector('#dp-label').textContent = dpFrom + ' → ' + dpTo; }
  function markCustom() {
    wrap.querySelectorAll('.dp-shortcut').forEach(x => x.classList.remove('active'));
    wrap.querySelector('.dp-shortcut[data-days="custom"]').classList.add('active');
  }

  let _committedFrom = dpFrom, _committedTo = dpTo, _committedShortcut = '7', _applyFired = false;
  const applyBtn = wrap.querySelector('#dp-apply-btn');

  function activeShortcut() { const el = wrap.querySelector('.dp-shortcut.active'); return el ? el.dataset.days : null; }
  function selectionChanged() {
    const sc = activeShortcut();
    if (sc && sc !== 'custom') return sc !== _committedShortcut;
    return dpFrom !== _committedFrom || dpTo !== _committedTo;
  }
  function refreshApplyBtn() { applyBtn.disabled = !selectionChanged(); }
  function restoreShortcut() {
    wrap.querySelectorAll('.dp-shortcut').forEach(x => x.classList.remove('active'));
    const el = wrap.querySelector(`.dp-shortcut[data-days="${_committedShortcut}"]`);
    if (el) el.classList.add('active');
  }

  wrap.querySelectorAll('.dp-shortcut').forEach(sc => {
    sc.onclick = (e) => {
      e.stopPropagation();
      const days = sc.dataset.days;
      const t = new Date(todayStr + 'T00:00:00');
      wrap.querySelectorAll('.dp-shortcut').forEach(x => x.classList.remove('active'));
      sc.classList.add('active');
      if (days === 'custom') { dpFrom = minDate; dpTo = maxDate; }
      else if (days === '0') { dpFrom = dpTo = fmt(t); }
      else if (days === '1') { const y = new Date(t); y.setDate(t.getDate() - 1); dpFrom = dpTo = fmt(y); }
      else if (days === 'month') { dpFrom = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-01`; dpTo = fmt(t); }
      else if (days === 'year') { dpFrom = `${t.getFullYear()}-01-01`; dpTo = fmt(t); }
      else { const s = new Date(t); s.setDate(t.getDate() - (parseInt(days) - 1)); dpFrom = fmt(s); dpTo = fmt(t); }
      if (dpFrom < minDate) dpFrom = minDate;
      dpPhase = 'from'; dpHover = null;
      const d = new Date(dpTo + 'T00:00:00'); dpViewY = d.getFullYear(); dpViewM = d.getMonth();
      buildCal(); renderLabel(); refreshApplyBtn();
    };
  });

  const grid = wrap.querySelector('#dp-grid');
  grid.addEventListener('click', (e) => {
    e.stopPropagation();
    const b = e.target.closest('.dp-day');
    if (!b || b.classList.contains('other-month') || !b.dataset.date) return;
    const date = b.dataset.date;
    if (dpPhase === 'from') { dpFrom = date; dpTo = date; dpPhase = 'to'; dpHover = null; markCustom(); buildCal(); }
    else {
      if (date < dpFrom) { dpTo = dpFrom; dpFrom = date; } else { dpTo = date; }
      dpPhase = 'from'; dpHover = null; markCustom(); buildCal(); renderLabel(); refreshApplyBtn();
    }
  });
  grid.addEventListener('mouseover', (e) => {
    const b = e.target.closest('.dp-day');
    if (!b || b.classList.contains('other-month') || !b.dataset.date || dpHover === b.dataset.date) return;
    dpHover = b.dataset.date;
    if (dpPhase === 'to') buildCal();
  });
  grid.addEventListener('mouseleave', () => { if (dpPhase === 'to' && dpHover) { dpHover = null; buildCal(); } });

  wrap.querySelector('#dp-prev-btn').onclick = () => { dpViewM--; if (dpViewM < 0) { dpViewM = 11; dpViewY--; } buildCal(); };
  wrap.querySelector('#dp-next-btn').onclick = () => {
    const maxD = new Date(todayStr + 'T00:00:00');
    if (dpViewY > maxD.getFullYear() || (dpViewY === maxD.getFullYear() && dpViewM >= maxD.getMonth())) return;
    dpViewM++; if (dpViewM > 11) { dpViewM = 0; dpViewY++; } buildCal();
  };

  applyBtn.onclick = (e) => {
    e.stopPropagation();
    _applyFired = true; _committedFrom = dpFrom; _committedTo = dpTo; _committedShortcut = activeShortcut() || 'custom';
    applyBtn.disabled = true;
    if (onApply) onApply(dpFrom, dpTo);
    panel.classList.remove('open'); trigger.classList.remove('open');
  };

  new MutationObserver(() => {
    if (!panel.classList.contains('open')) {
      if (!_applyFired) { dpFrom = _committedFrom; dpTo = _committedTo; renderLabel(); restoreShortcut(); }
      _applyFired = false; applyBtn.disabled = true;
    }
  }).observe(panel, { attributes: true, attributeFilter: ['class'] });

  trigger.onclick = () => {
    const isOpen = panel.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) {
      dpPhase = 'from'; dpHover = null;
      const d = new Date(dpTo + 'T00:00:00'); dpViewY = d.getFullYear(); dpViewM = d.getMonth();
      panel.classList.add('open'); trigger.classList.add('open'); applyBtn.disabled = true; buildCal();
    }
  };

  renderLabel();
  _openables.push({ panelEl: panel, btnEl: trigger });
  return { getRange: () => ({ start: dpFrom, end: dpTo }) };
}

/* ── "today" + ignoring future rows ─────────────────────────────────────────
   The sample data runs through 2026-12-30, but rows after the real today are
   business that hasn't happened yet — a live dashboard can't show it, so it's
   dropped entirely (not just hidden behind the date picker's disabled days). ── */
function fmtDate(d) { const pad = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const REAL_TODAY = fmtDate(new Date());
const EFFECTIVE_MAX_DATE = REAL_TODAY < DATA_MAX_DATE ? REAL_TODAY : DATA_MAX_DATE;
const ALL_ROWS = DASH_ROWS.filter(r => r.d <= EFFECTIVE_MAX_DATE);

const _last7From = new Date(EFFECTIVE_MAX_DATE + 'T00:00:00'); _last7From.setDate(_last7From.getDate() - 6);
const DEFAULT_START = fmtDate(_last7From) < DATA_MIN_DATE ? DATA_MIN_DATE : fmtDate(_last7From);

/* ── global filter state ─────────────────────────────────────────────────── */
const filterState = { start: DEFAULT_START, end: EFFECTIVE_MAX_DATE, state: [], segment: [], manufacturer: [], category: [], subcat: [], customer: [] };

const SEGMENTS = ['Consumer', 'Corporate', 'Home Office'];
const CATEGORIES = ['Furniture', 'Office Supplies', 'Technology'];
const SUBCATS = Array.from(new Set(ALL_ROWS.map(r => r.sc))).sort();
const MANUFACTURERS = Array.from(new Set(ALL_ROWS.map(r => r.mf))).sort();
const CUSTOMERS = Array.from(new Set(ALL_ROWS.map(r => r.cu))).sort();
const STATE_ITEMS = Object.entries(STATE_NAME)
  .map(([abbr, name]) => ({ value: abbr, label: `${name} (${abbr})` }))
  .sort((a, b) => a.label.localeCompare(b.label));

let metric = 'sales'; // 'sales' | 'profit' | 'orders'
const charts = {};

function onAnyFilterChange() { applyBtn.disabled = false; updateClearVisibility(); }

/* filters ordered left-to-right the same way the 6 charts read: State, Segment,
   Manufacturers, Category, Sub-Category, Customers — date picker leads the row. */
const dp = createDatePicker({
  mountId: 'filter-bar', minDate: DATA_MIN_DATE, maxDate: EFFECTIVE_MAX_DATE,
  onApply: (start, end) => { filterState.start = start; filterState.end = end; renderAll(); },

/* ── data filtering + formatting ─────────────────────────────────────────── */
function filteredRows() {
  return ALL_ROWS.filter(r =>
    r.d >= filterState.start && r.d <= filterState.end &&
    (!filterState.state.length || filterState.state.includes(r.st)) &&
    (!filterState.segment.length || filterState.segment.includes(r.sg)) &&
    (!filterState.manufacturer.length || filterState.manufacturer.includes(r.mf)) &&
    (!filterState.category.length || filterState.category.includes(r.ct)) &&
    (!filterState.subcat.length || filterState.subcat.includes(r.sc)) &&
    (!filterState.customer.length || filterState.customer.includes(r.cu))
  );
}
function fmtCompact(v, isCount) {
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  if (isCount) return sign + Math.round(abs).toLocaleString();
  if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(1) + 'K';
  return sign + '$' + abs.toFixed(0);
}
function fmtFull(v, isCount) {
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  return isCount ? sign + Math.round(abs).toLocaleString() : sign + '$' + Math.round(abs).toLocaleString();
}
function calcTotals(rows) {
  let sales = 0, profit = 0;
  const orderSet = new Set(), custSet = new Set();
  for (const r of rows) { sales += r.s; profit += r.p; orderSet.add(r.oid); custSet.add(r.cu); }
  return { sales, profit, orders: orderSet.size, customers: custSet.size };
}
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── over-time bucketing (day / week / month / quarter / year, computed on the fly) ── */
function bucketKey(dateStr, gran) {
  if (gran === 'day') return dateStr;
  if (gran === 'week') {
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day)); // Monday of that week
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  if (gran === 'month') return dateStr.slice(0, 7);
  if (gran === 'quarter') {
    const [y, m] = dateStr.split('-');
    return `${y}-Q${Math.ceil(parseInt(m, 10) / 3)}`;
  }
  return dateStr.slice(0, 4); // year
}
function fmtBucketLabel(key, gran) {
  if (gran === 'day') {
    const d = new Date(key + 'T00:00:00');
    return MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  if (gran === 'week') {
    const d = new Date(key + 'T00:00:00');
    return 'Week of ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  if (gran === 'month') { const [y, m] = key.split('-'); return MONTH_NAMES[parseInt(m, 10) - 1] + ' ' + y; }
  if (gran === 'quarter') { const [y, q] = key.split('-'); return q + ' ' + y; }
  return key; // year
}
function overtimeSeries(rows, gran) {
  const buckets = new Map(); // key -> {sales,profit,orders:Set}
  for (const r of rows) {
    const k = bucketKey(r.d, gran);
    if (!buckets.has(k)) buckets.set(k, { sales: 0, profit: 0, orders: new Set() });
    const b = buckets.get(k);
    b.sales += r.s; b.profit += r.p; b.orders.add(r.oid);
  }
  const keys = Array.from(buckets.keys()).sort();
  return {
    labels: keys,
    sales: keys.map(k => buckets.get(k).sales),
    profit: keys.map(k => buckets.get(k).profit),
    orders: keys.map(k => buckets.get(k).orders.size),
  };
}
function aggregate(rows, dimKey) {
  const m = new Map();
  for (const r of rows) {
    const k = r[dimKey];
    if (k === null || k === undefined || k === '') continue;
    if (!m.has(k)) m.set(k, { sales: 0, profit: 0, orders: new Set() });
    const o = m.get(k);
    o.sales += r.s; o.profit += r.p; o.orders.add(r.oid);
  }
  return m;
}
function metricValue(o) { return metric === 'orders' ? o.orders.size : o[metric]; }

const GROUP_DIM = { map: 'st', segment: 'sg', mfg: 'mf', category: 'ct', subcat: 'sc', customers: 'cu' };
const TOP_N = { mfg: 10, subcat: 10, customers: 10 };
function buildCardData(cardId, rows) {
  const m = aggregate(rows, GROUP_DIM[cardId]);
  let entries = Array.from(m.entries()).map(([label, o]) => ({ label, val: metricValue(o) }));
  entries.sort((a, b) => Math.abs(b.val) - Math.abs(a.val));
  if (TOP_N[cardId]) entries = entries.slice(0, TOP_N[cardId]);
  return entries;
}

/* ── KPI + sparklines ────────────────────────────────────────────────────── */
function setKpi(key, val, isCount) {
  const el = document.getElementById('kpi-' + key + '-value');
  el.textContent = fmtFull(val, isCount);
  el.className = 'metric-value' + (val < 0 ? ' negative' : '');
}
let granularity = 'day'; // 'day' | 'week' | 'month' | 'quarter' | 'year'
const METRIC_COLOR = { sales: '#5B8DF8', profit: '#e5ff00', orders: '#2DD4BF' };

function renderOvertime(rows) {

      }],

        y: { ticks: { color: '#8e8e8e', font: { family: 'Inter', size: 10 }, callback: (v) => fmtCompact(v, metric === 'orders') }, grid: { color: '#282828' } },
      },

/* ── chart cards ─────────────────────────────────────────────────────────── */

        y: { ticks: { color: '#bababa', font: { family: 'Inter', size: 11 } }, grid: { display: false } },
      } : {

}

/* ── real US-state choropleth map (chartjs-chart-geo + us-atlas topojson) ── */
function renderMap(rows) {
  if (!US_STATES_FEATURES) return; // topojson still loading — fetch's .then() calls this again once ready
  const data = buildCardData('map', rows);
  const byState = new Map(data.map(d => [d.label, d.val]));
  const maxAbs = Math.max(1, ...data.map(d => Math.abs(d.val)));
  const isProfit = metric === 'profit';
  const points = US_STATES_FEATURES.map(feature => {
    const abbr = NAME_TO_ABBR[feature.properties.name];
    const value = abbr && byState.has(abbr) ? byState.get(abbr) : null;
    return { feature, value };
  });
  if (charts['map']) charts['map'].destroy();
  charts['map'] = new Chart(document.getElementById('chart-map'), {
    type: 'choropleth',
    data: {
      labels: points.map(p => p.feature.properties.name),
      datasets: [{
        label: 'States',
        outline: US_NATION_FEATURE,
        showOutline: true,
        backgroundColor: (ctx) => {
          if (!ctx.dataset || ctx.dataIndex === undefined) return 'var(--nested)';
          const v = ctx.dataset.data[ctx.dataIndex] && ctx.dataset.data[ctx.dataIndex].value;
          if (v === null || v === undefined) return 'rgba(64,64,64,0.35)';
          const intensity = 0.18 + 0.72 * (Math.abs(v) / maxAbs);
          return (isProfit && v < 0) ? `rgba(255,49,49,${intensity.toFixed(2)})` : `rgba(91,141,248,${intensity.toFixed(2)})`;
        },
        borderColor: '#404040', borderWidth: 0.5,
        data: points,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      showOutline: true, showGraticule: false,
      plugins: {
        legend: { display: false }, datalabels: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => items[0].raw.feature.properties.name,
            label: (item) => {
              const v = item.raw.value;
              return (v === null || v === undefined) ? 'no data in range' : fmtCompact(v, metric === 'orders');
            },
          },
        },
      },
      scales: {
        projection: { axis: 'x', projection: 'albersUsa' },
        color: { axis: 'x', display: false },
      },
    },
  });
}

/* ── titles + full render ────────────────────────────────────────────────── */
const GRAN_LABEL = { day: 'Day', week: 'Week', month: 'Month', quarter: 'Quarter', year: 'Year' };
function updateTitles() {
  const label = { sales: 'Sales', profit: 'Profit', orders: 'Orders' }[metric];

/* ── events ──────────────────────────────────────────────────────────────── */
document.getElementById('metric-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-metric]');
  if (!btn) return;
  metric = btn.dataset.metric;
  document.querySelectorAll('#metric-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  renderAll();
});
document.getElementById('gran-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-gran]');
  if (!btn) return;
  granularity = btn.dataset.gran;
  document.querySelectorAll('#gran-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('title-overtime').textContent = { sales: 'Sales', profit: 'Profit', orders: 'Orders' }[metric] + ' | By ' + GRAN_LABEL[granularity];
  renderOvertime(filteredRows());
});

/* ── boot ────────────────────────────────────────────────────────────────── */
renderAll();
</script>
</body>
</html>
